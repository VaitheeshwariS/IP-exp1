<!DOCTYPE html>
<html>

<body style="background-color:beige; font-family:Arial,sans-serif; text-align:center;">

<h1 style="background-color:orange; color:white; padding:20px;">
ONLINE SHOPPING SYSTEM
</h1>

<h2 style="color:black;">Login</h2>

<form action="home.html"
style="background-color:white;
width:300px;
margin:auto;
padding:25px;
border:2px solid black;

<input type="email" required placeholder="Enter the email"

<input type="password" required placeholder="Enter the password"
style="width:90%; padding:8px;"><br><br>

<input type="submit"
value="Login"
style="background-color:orange;
color:white;
padding:10px;
width:95%;
border:none;
cursor:pointer;">

<br><br>

<p>Don't have an account?</p>

<a href="register.html"
style="text-decoration:none;
color:blue;
font-weight:bold;">
Register Here
</a>

</form>

</body>
</html>
